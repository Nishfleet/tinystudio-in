name: Live Site Check

# Guards the deployed tinystudio.in against soft-404s, WCAG 2.2 tap-target
# drift (SC 2.5.8 24px minimum), regressed heading hierarchies, and stale
# bundles without blocking pull requests. The deploy lane
# (deploy-public-site.yml) verifies the live site after every publish; this
# workflow is the nightly net that catches a stale or misconfigured
# deployment within a day even when nothing merges. It is deliberately NOT
# part of `npm run ci` - that blocking chain must stay green on repo state
# alone.
#
# This job is the staleness alarm and RED MEANS ACT. Production was stale on
# the 2026-06-20 bundle until the release lane was repaired on 2026-08-20
# (#208 CF_API_BASE, #209 Node 22, #211 dead acceptance section) and
# redeployed origin/main; the first green run after the repair was
# 2026-08-20. A red run now means the live site regressed or went stale
# again - re-run deploy-public-site.yml and read its output. It is never a
# reason to disable or "expect" the failure.

on:
  schedule:
    # Nightly: catch stale or broken deployments (soft-404s, sub-24px link
    # targets, offline site) within a day even when no pull requests are open.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-check-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live-soft-404:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check-public-live-soft-404.mjs
      - run: node scripts/test-public-live-heading-hierarchy.mjs
  live-contact-heading-hierarchy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-public-live-contact-heading-hierarchy.mjs
  live-tap-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check-public-live-tap-targets.mjs
  live-social-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check-public-live-social-preview.mjs
