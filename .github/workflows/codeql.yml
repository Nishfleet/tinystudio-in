name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  # `actions: read` is required: the codeql-action's final status/upload call
  # reads the workflow run (REST get-a-workflow-run), and an explicit
  # permissions block zeroes every scope not listed here. Without it the
  # analyze step dies with "Resource not accessible by integration".
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # No private-repo gate: this repo is private, so the old
    # `vars.ENABLE_PRIVATE_CODEQL == '1'` opt-in skipped analysis on every run.
    # Security analysis must run on every trigger below.
    name: analyze javascript-typescript
    runs-on: [self-hosted, linux, x64, vps-verify]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
