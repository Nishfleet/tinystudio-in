name: Codex CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
      # Free, always-running dependency security scan. This is the deliberate
      # substitute for CodeQL code scanning, which cannot run on this plan:
      # this is a private personal-account repo without GitHub Advanced
      # Security, so the CodeQL SARIF upload rejects with "Code scanning is
      # not enabled for this repository" and the job was removed in #122.
      # Fail-closed: any high-severity advisory in the locked tree fails the
      # required repo-checks job. Re-enable CodeQL per .github/workflows/README.md
      # once GHAS/code scanning is provisioned or the repo goes public.
      - name: Dependency security scan (CodeQL substitute)
        run: npm audit --audit-level=high

  semgrep:
    # ADVISORY-ONLY on this private repo. Branch protection is paywalled on
    # the free personal-account plan (see issue #274), so this check runs and
    # reports but CANNOT be made a required context — it does not block
    # merges. Do NOT arm `--auto` on PRs here: without enforceable protection
    # an armed PR merges instantly regardless of this check's result (#274).
    # The orchestrator merges after review.
    #
    # Consumes the canonical no-hand-built-orchestration ruleset by PINNED
    # raw URL at Nishfleet/siterep-public@4738f06 (exact commit SHA) plus
    # p/default for defense-in-depth. Per-repo copies of the ruleset are
    # forbidden — one canonical source, every repo consumes it by pin.
    # Fails only on ERROR/HIGH findings; lower-severity p/default noise is
    # reported but does not block.
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install semgrep (pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          # Pinned to an exact release (published 2026-07-28, >7 days old).
          # Bump deliberately; do not use `latest` or a floating range.
          pip install semgrep==1.172.0
      - name: Semgrep scan (canonical orchestration gate + p/default)
        run: |
          set -uo pipefail
          # --exclude .specify: this directory is vendored spec-kit
          # scaffolding (37 tracked files), not the repo's product code. Its
          # bash/common.sh has an unbounded poll loop root-walk (breaks at /)
          # that the orchestration gate flags. The canonical gate's own
          # paths.include already excludes node_modules; excluding vendored
          # scaffolding is the same discipline. Product code under
          # .github/workflows/, scripts/, and the app still gets full coverage.
          CANONICAL_SHA="4738f06365012bc9f1f54c5981cedf9ddd3fa1eb"
          CANONICAL_URL="https://raw.githubusercontent.com/Nishfleet/siterep-public/${CANONICAL_SHA}/.semgrep/no-hand-built-orchestration.yml"
          semgrep --config "${CANONICAL_URL}" \
                  --config p/default \
                  --exclude .specify \
                  --quiet --metrics=off --json > semgrep-results.json
          jq -r '.results[] | "::" + (.extra.severity | ascii_downcase) + "::" + .path + ":" + (.start.line|tostring) + " [" + .check_id + "] " + (.extra.message | gsub("\n";" "))' semgrep-results.json 2>/dev/null || true
          if jq -e '[.results[] | select(.extra.severity | ascii_downcase | IN("error","high"))] | length > 0' semgrep-results.json >/dev/null 2>&1; then
            echo "::error::Semgrep found ERROR/HIGH-severity findings (listed above)."
            exit 1
          fi
          echo "::notice::Semgrep clean (no ERROR/HIGH findings)."

  actionlint:
    # ADVISORY-ONLY on this private repo (see semgrep job above and #274):
    # runs and reports, cannot be a required context on the free plan. Lint
    # job config is wiring (not a ruleset), so per-repo duplication is
    # acceptable — only the semgrep ruleset stays canonical.
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: false
          pyflakes: false
