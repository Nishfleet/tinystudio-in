name: Codex CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No helper scripts (regrowth gate, #291)
        run: test -z "$(git ls-files scripts bin tools ops .specify '*.sh')"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
      # Free, always-running dependency security scan. This is the deliberate
      # substitute for CodeQL code scanning, which cannot run on this plan:
      # this is a private personal-account repo without GitHub Advanced
      # Security, so the CodeQL SARIF upload rejects with "Code scanning is
      # not enabled for this repository" and the job was removed in #122.
      # Fail-closed: any high-severity advisory in the locked tree fails the
      # required repo-checks job. Re-enable CodeQL per .github/workflows/README.md
      # once GHAS/code scanning is provisioned or the repo goes public.
      - name: Dependency security scan (CodeQL substitute)
        run: npm audit --audit-level=high

  # no-glue: the shared fleet gate (fleet-ops#8756). One composite action in
  # Nishfleet/fleet-ops; a job named `no-glue` invokes it as a step so the
  # check context is exactly `no-glue` for the main-required-checks ruleset.
  # src/** and test/** carry this repo's own .mjs code — extra-allowed;
  # script dirs and shell extensions stay banned everywhere.
  no-glue:
    name: no-glue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Nishfleet/fleet-ops/.github/actions/no-glue@main
        with:
          extra-allowed: "src/** test/**"
