name: Lighthouse

# Audits the live pages against the fleet speed budget (fleet-ops
# config/lighthouserc.json) after every successful public site deploy and
# weekly. A red job is the signal.

on:
  workflow_run:
    workflows: [Deploy public site]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: lighthouse
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: Nishfleet/fleet-ops/.github/workflows/lighthouse.yml@main
    permissions:
      contents: read
    with:
      urls: |
        https://tinystudio.in/
        https://tinystudio.in/contact/
        https://tinystudio.in/compare/
        https://tinystudio.in/drishti/
        https://tinystudio.in/promptly/support/
