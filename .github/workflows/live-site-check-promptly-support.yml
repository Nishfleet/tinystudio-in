name: Live Promptly Support Heading Check

# Nightly staleness alarm for PR #20 (sol-postmerge-20): live
# /promptly/support/ must keep the repaired H2 info-card outline.
# Deliberately NOT part of npm test / npm run ci and NOT triggered on
# pull requests.
# Expected FAIL while the June-20 bundle is live. Do not disable this
# workflow to hide the red; the red is the signal to refresh origin/main
# once CLOUDFLARE_API_TOKEN exists (sibling 4603d44a5e).

on:
  schedule:
    # Offset from live-site-check.yml (23 3 * * *) so the two nightly
    # heading jobs do not start on the same minute.
    - cron: "33 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-check-promptly-support-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live-promptly-support-heading-hierarchy:
    runs-on: [self-hosted, linux, x64, vps-verify]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-public-live-promptly-support-heading-hierarchy.mjs
