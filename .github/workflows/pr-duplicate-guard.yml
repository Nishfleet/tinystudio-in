name: PR Duplicate Guard

# Stops duplicate same-fix pull requests from silently piling up (the fleet
# kept dispatching the same finding to multiple lanes: #36/#44/#55/#56,
# #39/#49, #40/#52, #38/#48/#51, ...). On every PR event this job compares
# the PR's diff against every other OPEN pull request. When another open PR
# covers the same fix (>= 80% shared changed-file coverage and >= 50% patch
# similarity on the shared files), the check fails loudly and the job posts
# one marker comment naming the duplicate(s) and the canonical PR. The check
# is deliberately not a required status, so legitimate work never blocks on
# it; it exists to make the duplication visible the moment it happens.
#
# Run locally before opening a PR:
#   node scripts/check-pr-duplicates.mjs --pr 0 --no-fail --repo OWNER/REPO
# (use the real PR number once the PR exists).
#
# CHEAP BY DESIGN (2026-08-24): the script is dependency-free (only
# node:url, a Node builtin) and fetches every PR diff through the GitHub
# API, so it needs neither a repo checkout nor an npm install. The old job
# did actions/checkout + setup-node + (implicitly) a full tree on every PR
# event and averaged ~11 minutes a run. This version fetches just the one
# script file via the contents API and runs it with the runner's built-in
# node, finishing in seconds. The check itself is unchanged: same script,
# same thresholds, same --comment behaviour.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number to check (defaults to the PR that triggered the run)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-duplicate-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duplicate-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the guard script and run it (no checkout, no npm install)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr-number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The script is the only repo file this job needs; it pulls every
          # PR diff via the API. Fetching it via the contents API avoids a
          # full checkout and an npm install, cutting the run from ~11 min
          # to seconds. ubuntu-latest ships Node 20+, so no setup-node.
          mkdir -p scripts
          curl -sS --fail \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/check-pr-duplicates.mjs" \
            | python3 -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
            > scripts/check-pr-duplicates.mjs
          node scripts/check-pr-duplicates.mjs --pr "$PR_NUMBER" --comment
