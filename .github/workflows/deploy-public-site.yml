name: Deploy public site

# The tinystudio.in release lane. Every merge to main prepares a filtered
# deploy bundle from public/ (the snoozed managed-service buyer path from
# PRs #10/#11 is removed; every other merged fix is kept), publishes it to
# the Cloudflare Pages project tiny-studio (subdomain tiny-studio-3f5.pages.dev) with wrangler direct upload
# (independent of the Cloudflare GitHub integration, which has been broken
# since 2026-06-20), then verifies the live site against the neutral merged
# fixes (H2-after-H1 on /promptly/support/, JSON-LD on /contact/, real 404s,
# portfolio-only homepage).
#
# The lane is fail-closed, provable and reversible:
#   - Missing required secrets FAIL the run loudly. A skipped publish must
#     never produce a green deploy status: green means "deployed and
#     verified", nothing else. The old "dormant" green step hid the missing
#     token behind green runs.
#   - Before upload the lane captures the current production deployment
#     identity as the rollback target and refuses to deploy without one
#     (scripts/publish-public-site.mjs).
#   - After upload the lane PROVES the upload became production (canonical
#     deployment id moved, source commit is this bundle's). The acceptance
#     below only asserts already-merged fixes, so it passes against the OLD
#     site: without this proof an upload that never went live still reported
#     "done". Promotion failures do not roll back - production never moved,
#     or moved to a deployment that is not ours.
#   - Then the lane runs the live acceptance; on failure it restores
#     the exact previous Pages deployment via the Cloudflare rollback API,
#     re-verifies the restored identity, re-runs acceptance, and fails
#     loudly if the rollback itself fails.
#
# Required secrets (fail-closed when missing - a skipped publish must never
# produce a green deploy status):
#   CLOUDFLARE_API_TOKEN  - Cloudflare API token with Cloudflare Pages:Edit
#                           on the tinystudio.in account. PROVISIONED
#                           2026-08-20 under the secret name CLOUDFLARE; the
#                           job env below accepts either name.
#   CLOUDFLARE_ACCOUNT_ID - f670a698e17bf160c8e4679823e68916
# The fleet Workers token (fleet-console/cf.env) does NOT have Pages:Edit;
# provisioning a Pages-scoped token was a one-time dashboard step.
#
# Missing wiring FAILS the run loudly instead of skipping the publish under
# a green "dormant" status: green means "deployed and verified", nothing
# else. The nightly live-site-check.yml is the independent staleness alarm.
#
# History: the lane was created dormant, then failed on every run from
# creation until 2026-08-20 - CF_API_BASE was /api/v4 (403 on every call,
# #208), wrangler 4.123 refuses Node 20 (#209) and acceptance section J was
# dead code (#211). Production served the 2026-06-20 bundle throughout. The
# first fully green publish was 2026-08-20.
#
# The daily schedule is the self-heal net: the lane redeploys on its own
# within a day instead of waiting for the next main push, so a repair with no
# pending merge still reaches production.

on:
  push:
    branches:
      - main
  schedule:
    # Daily: catch a stale or reverted production deployment within a day.
    - cron: "13 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-public-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, vps-verify]
    # Secrets are hoisted to the job env because the `secrets` context is not
    # available in step-level `if:` conditions; the `env` context is.
    env:
      # Accept either secret name: CLOUDFLARE_API_TOKEN (documented) or
      # CLOUDFLARE (what the owner provisioned 2026-08-20). First non-empty wins.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Required Pages secrets not provisioned - fail loudly
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error title=Release lane cannot run::No Cloudflare token secret (CLOUDFLARE_API_TOKEN or CLOUDFLARE) and/or CLOUDFLARE_ACCOUNT_ID set in repo secrets. The lane fails closed instead of skipping the publish: a skipped publish must never show a green deploy status."
          echo "One-time provisioning (dashboard, ~2 minutes):"
          echo "  1. https://dash.cloudflare.com/profile/api-tokens -> Create Token"
          echo "  2. Use the 'Cloudflare Pages: Edit' template, scope it to the account (account id f670a698e17bf160c8e4679823e68916), create, copy the token."
          echo "  3. gh secret set CLOUDFLARE_API_TOKEN -R nish3451/tinystudio-in"
          echo "  4. gh secret set CLOUDFLARE_ACCOUNT_ID -R nish3451/tinystudio-in -b f670a698e17bf160c8e4679823e68916"
          echo "  5. Re-run this lane (or wait for the next main merge); no code change needed."
          exit 1

      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      - name: Pre-deploy repository gate
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run check

      - name: Prepare the filtered deploy bundle
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/publish-public-site.mjs --prepare-only --output "$RUNNER_TEMP/tinystudio-public-bundle"

      - name: Publish to Cloudflare Pages and verify live (auto-rollback on acceptance failure)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/publish-public-site.mjs --deploy --bundle "$RUNNER_TEMP/tinystudio-public-bundle"
